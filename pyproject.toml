[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-harness"
version = "0.1.0"
description = "MCP server simulation harness for testing and development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "openapi-spec-validator>=0.7.0",
    "jsonschema>=4.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.2.0",
    # Capped at 0.6.12: read-only filesystem enforcement now goes through
    # FilesystemMiddleware's (private) `_permissions` parameter — see
    # agent/deep_agent.py. The standalone `_PermissionMiddleware` was removed
    # in 0.5.5+. Revisit deep_agent.py if `_permissions` moves to the backend.
    "deepagents>=0.5.3,<=0.6.12",
    "jinja2>=3.0.0",
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.20.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "import-linter>=2.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simulation_harness = [
    "skills/assets/*.md",
    "skills/assets/generation/*.md",
    "skills/assets/generation/*.jinja2",
    "agent/templates/*.jinja2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.bandit]
# SAST scan scope is src/ only (tests use asserts/fixtures that trip false
# positives). CI runs `bandit -c pyproject.toml -r src/`.
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Lenient global baseline so the type-check gate passes on today's code while
# annotation coverage grows. Tighten these (and shrink the override list below)
# as modules are annotated. See `make type-check`.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
files = ["src/simulation_harness", "tests"]

# Burn-down backlog: modules with pre-existing type errors are exempted so the
# gate enforces "no NEW untyped breakage". Remove a module from this list once
# `uv run mypy <path>` is clean for it.
[[tool.mypy.overrides]]
module = [
    "simulation_harness.__main__",
    "simulation_harness.main",
    "simulation_harness.agent.deep_agent",
    "simulation_harness.config.models",
    "simulation_harness.config.settings",
    "simulation_harness.core.simulation_host",
    "simulation_harness.core.simulation_instance",
    "simulation_harness.mcp_integration.sidecar_server",
    "simulation_harness.models.domain",
    "simulation_harness.skills.generator",
    "simulation_harness.skills.generation.stages.assemble",
    "simulation_harness.skills.generation.stages.operations",
    "simulation_harness.skills.generation.stages.scenarios",
    "simulation_harness.skills.generation.stages.schema",
    "simulation_harness.skills.generation.stages.seed",
    "simulation_harness.skills.generation.stages.analyze.classify",
    "simulation_harness.skills.generation.stages.analyze.extract",
    "simulation_harness.utils.logging",
]
ignore_errors = true

[tool.importlinter]
root_package = "simulation_harness"

# Layered architecture: api → core → (skills/agent/state/openapi) → models/utils.
# These contracts pin the leaf layers so lower modules can't reach back up into
# higher ones. Run with `make lint-imports` (or `uv run lint-imports`).
[[tool.importlinter.contracts]]
name = "models is a dependency-free leaf"
type = "forbidden"
source_modules = ["simulation_harness.models"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
    "simulation_harness.agent",
    "simulation_harness.skills",
    "simulation_harness.state",
    "simulation_harness.openapi",
    "simulation_harness.utils",
]

[[tool.importlinter.contracts]]
name = "utils does not depend on higher layers"
type = "forbidden"
source_modules = ["simulation_harness.utils"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
    "simulation_harness.agent",
    "simulation_harness.skills",
    "simulation_harness.openapi",
]

[[tool.importlinter.contracts]]
name = "openapi parsing does not depend on runtime layers"
type = "forbidden"
source_modules = ["simulation_harness.openapi"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
    "simulation_harness.agent",
    "simulation_harness.skills",
    "simulation_harness.state",
]

[[tool.importlinter.contracts]]
name = "state store does not depend on api/core/transport"
type = "forbidden"
source_modules = ["simulation_harness.state"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
]