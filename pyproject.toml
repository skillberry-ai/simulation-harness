[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-harness"
version = "0.1.0"
description = "MCP server simulation harness for testing and development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "openapi-spec-validator>=0.7.0",
    "jsonschema>=4.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.2.0",
    # Capped at 0.5.4: the runtime imports `_PermissionMiddleware` from
    # deepagents.middleware.permissions (read-only filesystem enforcement),
    # which was removed from that module in 0.5.5+. Revisit if upgrading.
    "deepagents>=0.5.3,<=0.5.4",
    "jinja2>=3.0.0",
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simulation_harness = [
    "skills/assets/*.md",
    "agent/templates/*.jinja2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"