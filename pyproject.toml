[build-system]
requires = ["setuptools>=77.0", "wheel"]  # >=77 for PEP 639 license/license-files
build-backend = "setuptools.build_meta"

[project]
name = "simulation-harness"
version = "0.1.2"
description = "MCP server simulation harness for testing and development"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "IBM Corp." }]
keywords = ["mcp", "openapi", "simulation", "llm", "testing", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "openapi-spec-validator>=0.7.0",
    "jsonschema>=4.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.2.0",
    # Floor is 0.7.0: that release added FilesystemMiddleware's public `tools=`
    # allowlist, which agent/deep_agent.py uses for read-only enforcement.
    # (0.5.3/0.5.4 additionally lack the `_permissions` kwarg the old code used,
    # so the previous >=0.5.3 floor was already broken.)
    # Capped below the next minor because deepagents is pre-1.0, where minor
    # releases carry breaking changes — this cap is a semver guard, not a
    # hand-verified version, so widening it only needs a green CI run.
    "deepagents>=0.7.0,<0.8.0",
    "jinja2>=3.0.0",
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.20.0",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/skillberry-ai/simulation-harness"
Repository = "https://github.com/skillberry-ai/simulation-harness"
Issues = "https://github.com/skillberry-ai/simulation-harness/issues"
Changelog = "https://github.com/skillberry-ai/simulation-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    # Pinned, not floating: .pre-commit-config.yaml must name this exact version
    # or the hook and the CI format gate drift apart (issue #15).
    "ruff==0.16.6",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "import-linter>=2.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    # Not used directly: pip-audit pulls pip in via pip-api, and pip <26.2 is
    # flagged by PYSEC-2026-3721 -- which made pip-audit fail on its own
    # transitive dependency. Floor it so the scan stays green for the right
    # reason. Drop this once pip-api's resolution no longer needs pinning.
    "pip>=26.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simulation_harness = [
    "skills/assets/generation/*.md",
    "skills/assets/generation/*.jinja2",
    "agent/templates/*.jinja2"
]

[tool.ruff]
# Ruff 0.16 formats Python code blocks inside Markdown, by default, and the
# v0.16.6 `ruff-format` pre-commit hook adds `markdown` to its `types_or`.
# That reaches further than it looks: `docs/` prose, and the LLM prompt
# templates under src/simulation_harness/skills/assets/generation/*.md whose
# exact bytes are part of the harness's behavior. Opt out repo-wide rather
# than per-hook, so the hook and the CI gate cannot disagree (issue #15).
# `--force-exclude` in the hook entry makes this apply to the explicit
# filenames pre-commit passes, not just to directory walks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pinned explicitly, not inherited. With no `select` here, ruff lints on its
# built-in defaults -- and those are not stable across releases: 0.16.0
# expanded the default set from 59 rules to 404 and, less visibly, *dropped*
# 18 (E401, E402, E701-E703, E711-E714, E721, E731, E741-E743, F403, F405,
# F406, F722). Inheriting defaults therefore means a routine version bump can
# both flood CI with new findings and silently stop enforcing `== None`,
# star imports, and ambiguous names -- with nothing in the diff to show it.
#
# This list reproduces ruff's pre-0.16 default set. It is the baseline, not a
# ceiling: widening it is a deliberate code-quality change and belongs in its
# own PR, not in a dependency bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.bandit]
# SAST scan scope is src/ only (tests use asserts/fixtures that trip false
# positives). CI runs `bandit -c pyproject.toml -r src/`.
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Lenient global baseline so the type-check gate passes on today's code while
# annotation coverage grows. Tighten these (and shrink the override list below)
# as modules are annotated. See `make type-check`.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
files = ["src/simulation_harness", "tests"]

# Burn-down backlog: modules with pre-existing type errors are exempted so the
# gate enforces "no NEW untyped breakage". Remove a module from this list once
# `uv run mypy <path>` is clean for it.
[[tool.mypy.overrides]]
module = [
    "simulation_harness.__main__",
    "simulation_harness.main",
    "simulation_harness.agent.deep_agent",
    "simulation_harness.config.models",
    "simulation_harness.config.settings",
    "simulation_harness.core.simulation_host",
    "simulation_harness.core.simulation_instance",
    "simulation_harness.mcp_integration.sidecar_server",
    "simulation_harness.models.domain",
    "simulation_harness.skills.generator",
    "simulation_harness.skills.generation.stages.assemble",
    "simulation_harness.skills.generation.stages.operations",
    "simulation_harness.skills.generation.stages.scenarios",
    "simulation_harness.skills.generation.stages.schema",
    "simulation_harness.skills.generation.stages.seed",
    "simulation_harness.skills.generation.stages.analyze.classify",
    "simulation_harness.skills.generation.stages.analyze.extract",
    "simulation_harness.utils.logging",
]
ignore_errors = true

[tool.importlinter]
root_package = "simulation_harness"

# Layered architecture: api → core → (skills/agent/state/openapi) → models/utils.
# These contracts pin the leaf layers so lower modules can't reach back up into
# higher ones. Run with `make lint-imports` (or `uv run lint-imports`).
[[tool.importlinter.contracts]]
name = "models is a dependency-free leaf"
type = "forbidden"
source_modules = ["simulation_harness.models"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
    "simulation_harness.agent",
    "simulation_harness.skills",
    "simulation_harness.state",
    "simulation_harness.openapi",
    "simulation_harness.utils",
]

[[tool.importlinter.contracts]]
name = "utils does not depend on higher layers"
type = "forbidden"
source_modules = ["simulation_harness.utils"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
    "simulation_harness.agent",
    "simulation_harness.skills",
    "simulation_harness.openapi",
]

[[tool.importlinter.contracts]]
name = "openapi parsing does not depend on runtime layers"
type = "forbidden"
source_modules = ["simulation_harness.openapi"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
    "simulation_harness.agent",
    "simulation_harness.skills",
    "simulation_harness.state",
]

[[tool.importlinter.contracts]]
name = "state store does not depend on api/core/transport"
type = "forbidden"
source_modules = ["simulation_harness.state"]
forbidden_modules = [
    "simulation_harness.api",
    "simulation_harness.core",
    "simulation_harness.mcp_integration",
]
