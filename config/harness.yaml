# Simulation Harness Configuration
# See docs/design/REQUIREMENTS.md §1.6 for field descriptions
#
# Secrets are NOT configured here. Set the LLM_API_KEY env var
# (and optional LLM_API_BASE) in .env for local dev or via a
# Kubernetes Secret in cluster. See .env.example.

llm:
  provider: openai
  # Model ids are passed verbatim to the OpenAI-compatible endpoint, so use a
  # bare id (no "openai/" prefix). Point LLM_API_BASE at a proxy and override
  # these with HARNESS_LLM_* if your gateway uses different names.
  skill_generation_model: gpt-4.1   # one-time, per-spec skill generation
  simulation_model: gpt-4.1         # hot path - every tools/call
  temperature: 0
  # max_tokens: 4096  # Optional

skills:
  folder: ./skills-store

sessions:
  max_messages: 100
  idle_timeout_seconds: 3600
  max_concurrent_queue_depth: 8
  # Super-step budget per tool call for the multi-step skill-loading agent
  # (progressive disclosure + state tools). ~2 super-steps per round-trip.
  agent_recursion_limit: 50

creation:
  max_duration_seconds: 600

generation:
  concurrency: 5
  chunk_threshold: 40
  classify_batch_size: 40
  repair_retries: 2
  stage_timeout_seconds: 420

  # Per-stage LLM tuning, in pipeline execution order. Stage 1 (extract →
  # classify) runs first; stages 2-6 then run concurrently in a single gather,
  # so the order among them is nominal. Stage 7 (seed) reuses schema_seed, and
  # stage 8 (assemble) makes no LLM call.

  # Stage 1a — extract: spec → intermediate representation (entities, fields,
  # relationships) that every later stage reads.
  extract: { temperature: 0.0, max_tokens: 20000 }
  # Stage 1b — classify: label each operation's CRUD verb and behavioral
  # patterns, fanned out in bins of classify_batch_size.
  classify: { temperature: 0.0, max_tokens: 10000 }
  # Stages 2 & 3 — operation: write the per-operation SKILL.md sections, one
  # call per chunk (chunked by tag once the op count passes chunk_threshold).
  operation: { temperature: 0.2, max_tokens: 10000 }
  # Stages 4 & 7 — schema_seed: design schema.json from the IR, then populate
  # db.json from that schema plus the scenarios. Both calls share these params.
  schema_seed: { temperature: 0.0, max_tokens: 20000 }
  # Stage 6 — behavior: a global set of numeric ranges and derivation rules
  # injected into the SKILL.md preamble.
  behavior: { temperature: 0.0, max_tokens: 3000 }
  # Stage 5 — scenarios: enumerate representative user scenarios, which the
  # seed stage then designs db.json against. Persisted to scenarios.json and an
  # "Example Scenarios" section in SKILL.md. Optional, hence the toggle.
  scenarios_enabled: true   # Set false to skip scenario generation entirely
  scenarios_count: 5        # Number of scenarios to generate (best-effort)
  scenarios: { temperature: 0.4, max_tokens: 3000 }

mcp:
  transport: sse  # or streamable_http

server:
  host: 0.0.0.0  # Host to bind the server to (use 0.0.0.0 for all interfaces)
  port: 8086       # Port to bind the server to

logging:
  level: INFO
  destination_folder: ./logs

startup:
  # Master switch for boot-time autostart. false (default) → always boot idle and
  # ignore baked skills. Set true to auto-open a session from baked artifacts.
  # Override with HARNESS_AUTOSTART_ENABLED.
  autostart_enabled: false

  # Skill name to auto-start on boot (only used when autostart_enabled is true).
  # If null, the harness auto-discovers baked skills: 0 → idle, 1 → that skill,
  # >1 → most recently generated (logs a warning).
  # Override at runtime with HARNESS_AUTOSTART_SIMULATION.
  autostart_simulation: null

