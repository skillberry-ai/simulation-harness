# Simulation Harness Configuration
# See docs/design/REQUIREMENTS.md §1.6 for field descriptions
#
# Secrets are NOT configured here. Set the LLM_API_KEY env var
# (and optional LLM_API_BASE) in .env for local dev or via a
# Kubernetes Secret in cluster. See .env.example.

llm:
  provider: openai
  skill_generation_model: azure/gpt-5.4
  simulation_model: azure/gpt-5.4
  temperature: 0
  # max_tokens: 4096  # Optional

skills:
  folder: ./skills-store

sessions:
  max_messages: 100
  idle_timeout_seconds: 3600
  max_concurrent_queue_depth: 8

creation:
  max_duration_seconds: 120

mcp:
  transport: sse  # or streamable_http

server:
  host: 0.0.0.0  # Host to bind the server to (use 0.0.0.0 for all interfaces)
  port: 8086       # Port to bind the server to

logging:
  level: INFO
  destination_folder: ./logs

