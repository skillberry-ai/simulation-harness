# Deterministic local enforcement. Install once with:
#   uv run pre-commit install --install-hooks
#   uv run pre-commit install --hook-type commit-msg
# Run against everything:
#   uv run pre-commit run --all-files
repos:
  # Keep this rev equal to the pinned `ruff` in pyproject.toml's dev extra. CI
  # checks formatting with the project's ruff (`uv run ruff format --check`), so a
  # hook on a different version rewrites files the gate then rejects, and the two
  # fight over every commit that touches an affected file. See issue #15.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # Lint the release/mirroring shell scripts.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--external-sources]
        files: ^scripts/.*\.sh$

  # Static security analysis (SAST) over application code.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: bandit (SAST)
        args: [-c, pyproject.toml]
        files: ^src/

  # Enforce Conventional Commit messages (feat:, fix:, chore:, ...).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
