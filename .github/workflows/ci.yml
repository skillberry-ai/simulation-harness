name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Refuse to re-resolve dependencies in CI. Without this, uv treats a stale
# `uv.lock` as something to fix rather than an error: `uv sync` re-resolves,
# and so does a bare `uv run`, so a job can silently install versions the
# lockfile does not describe and still report green. That is how the ruff
# 0.16.6 bump (#25) ran 0.16.6 in CI while `uv.lock` still pinned 0.15.17.
#
# Set once at the workflow level rather than as `--locked` on each step,
# because `uv run` re-locks too -- flagging only the four `uv sync` steps
# would leave the eight `uv run` steps able to drift. Equivalent to passing
# `--locked` to every uv command.
#
# If a job now fails with "the lockfile needs to be updated": run `uv lock`
# and commit the result alongside the `pyproject.toml` change.
#
# On by default so a new job is guarded without having to remember this. A job
# that legitimately needs uv to *write* a lockfile opts out with
# `UV_LOCKED: "0"` -- note "0"/"false", not "": an empty value is a parse error,
# not "unset".
env:
  UV_LOCKED: "1"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    # Only a pull request has a base to diff against; a direct push to main has
    # no meaningful range to check.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check walks the PR's commits, so it needs their history, not
          # just the tip. Without this the merge-base lookup fails.
          fetch-depth: 0

      - name: Check DCO sign-off
        run: ./scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Import boundary check
        run: uv run lint-imports

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: mypy
        run: uv run mypy

  security:
    name: Dependency & code security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Static security analysis (bandit)
        run: uv run bandit -c pyproject.toml -r src/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov=simulation_harness --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  script-tests:
    name: Shell script tests
    runs-on: ubuntu-latest
    # Opt out of the workflow-level lock guard. These tests drive
    # scripts/release.sh against throwaway fixture repos, and
    # scripts/tests/test-release.sh runs `uv lock` inside one to create its
    # lockfile from scratch -- which `UV_LOCKED=1` refuses ("Unable to find
    # lockfile"). The guard protects *this* project's uv.lock; the fixtures are
    # not it.
    env:
      UV_LOCKED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # scripts/tests/ builds throwaway git repos as fixtures and sets identity
      # per fixture, so no global git config is needed. test-release.sh generates
      # its own ed25519 key for signing, so no secret is needed either. uv is
      # required because the release script refreshes uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run shell script tests
        run: make test-scripts

  test-client:
    name: Test client (vitest)
    runs-on: ubuntu-latest
    # Nothing in CI ran `utils/test-client` before this job, which is how #35
    # (vitest 3 -> 5) went green on all eleven checks while breaking 15 of the
    # 19 test files: the whole suite is JS, and every other job is Python or
    # shell. Dependabot watches these manifests, so the next major bump lands
    # the same way without a gate here.
    defaults:
      run:
        working-directory: utils/test-client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Read the version from `.nvmrc` rather than repeating it here, so CI and
      # a contributor's `nvm use` cannot drift apart. That file is the floor
      # from `package.json`'s `engines` (>=22.22.0), which also satisfies
      # vitest 5's ^22.12.0 || ^24 || >=26.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: utils/test-client/.nvmrc
          cache: npm
          cache-dependency-path: utils/test-client/package-lock.json

      # `npm ci` over `npm install`: it installs exactly what package-lock.json
      # describes and fails if the lockfile and manifests disagree, so a bump
      # that edits one without the other cannot pass by re-resolving. Same
      # reasoning as UV_LOCKED above.
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Build (SPA + server tsc)
        run: npm run build

      - name: Vitest
        run: npm test
