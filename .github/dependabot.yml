version: 2
updates:
  # Python dependencies. The `uv` ecosystem updates uv.lock alongside
  # pyproject.toml; `pip` only touched pyproject.toml, so every version-update
  # PR failed CI's `uv sync` under UV_LOCKED=1 (see #42).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore
    ignore:
      # ruff is pinned to match the ruff-pre-commit `rev` in
      # .pre-commit-config.yaml (issue #15). Dependabot can't edit that file,
      # and nothing in CI compares the two, so its bump would pass CI and leave
      # the hook drifted. Bump both together by hand.
      - dependency-name: ruff

  # GitHub Actions used in our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
    ignore:
      # We reference actions by floating major tag (e.g. codeql-action@v4,
      # checkout@v7), so minor/patch releases are picked up automatically at
      # run time. Dependabot cannot see that and would otherwise open a PR for
      # every patch (v4 -> 4.37.4), which *narrows* the ref and adds churn.
      # Major bumps (v4 -> v5) still come through, since those need a review.
      - dependency-name: github/codeql-action
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/dependency-review-action
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  # Base image used by the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
