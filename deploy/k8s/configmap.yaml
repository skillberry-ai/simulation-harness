apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-config
  namespace: simulation-harness
  labels:
    app.kubernetes.io/name: simulation-harness
    app.kubernetes.io/component: config
data:
  harness.yaml: |
    llm:
      provider: openai
      skill_generation_model: gpt-4.1
      simulation_model: gpt-4.1
      temperature: 0

    skills:
      folder: /app/skills-store

    sessions:
      max_messages: 100
      idle_timeout_seconds: 3600
      max_concurrent_queue_depth: 8

    mcp:
      transport: sse

    server:
      host: 0.0.0.0
      port: 8086

    logging:
      level: INFO
      destination_folder: /app/logs
