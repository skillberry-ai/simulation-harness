# Copy this file to secret.yaml, populate the values, then `kubectl apply -f`.
# secret.yaml is .gitignored — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: harness-secrets
  namespace: simulation-harness
  labels:
    app.kubernetes.io/name: simulation-harness
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  # Optional — set only if you use Azure / a proxy.
  # LLM_API_BASE: "https://your-resource.openai.azure.com/"
