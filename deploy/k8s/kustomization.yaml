apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simulation-harness

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # - hpa.yaml         # uncomment when you actually want autoscaling
  # - secret.yaml      # create from secret.example.yaml; never commit

images:
  - name: ghcr.io/REPLACE_ORG/simulation-harness
    newTag: latest

commonLabels:
  app.kubernetes.io/name: simulation-harness
  app.kubernetes.io/part-of: simulation-harness
